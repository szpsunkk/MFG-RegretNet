name: Reproduction evidence and platform

on:
  push:
    paths:
      - 'reproducibility/**'
      - 'platform/**'
      - '.github/workflows/reproduction.yml'
  pull_request:
    paths:
      - 'reproducibility/**'
      - 'platform/**'
      - '.github/workflows/reproduction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            reproducibility
            platform
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install numpy==1.24.4
      - run: python reproducibility/reproduce.py tables
      - run: python reproducibility/reproduce_control.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test && npm run test:evidence
        working-directory: platform
